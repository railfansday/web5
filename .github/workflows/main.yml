name: Auto Scrape & Paraphrase News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-update-lock
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Run News Scraper
        run: |
          python import.py

      - name: Commit & Push Updated Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Cek status file yang berubah sebelum di-add
          git status
          
          # Paksa tambahkan seluruh file dan folder artikel
          git add -A
          
          git status
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto update news, HTML, sitemap, and RSS"
            git pull --rebase -X ours --autostash origin main || true
            git push origin main
          else
            echo "Tidak ada file baru atau perubahan untuk di-push."
          fi
